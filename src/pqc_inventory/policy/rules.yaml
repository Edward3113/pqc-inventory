# Algorithm grading rules. Edit this file, not the code, when guidance changes.
#
# Sources:
#   NIST IR 8547 ipd (Nov 2024), Transition to Post-Quantum Cryptography Standards
#     https://doi.org/10.6028/NIST.IR.8547.ipd  -- still a draft; dates may change.
#   NIST SP 800-57 Part 1 Rev. 5 -- security strength of RSA / EC / DH key sizes.
#   OWASP Top 10:2025 A04 Cryptographic Failures -- TLS >= 1.2, forward secrecy, drop CBC.
#
# Statuses (worst to best):
#   broken             - weak today, independent of quantum computing
#   weak               - discouraged today (e.g. CBC suites), not immediately exploitable
#   quantum_vulnerable - acceptable today, on NIST's retirement timeline
#   quantum_ready      - post-quantum or hybrid post-quantum
#   ok                 - no finding (symmetric/protocol items with no quantum timeline)

schema_version: 2

# IR 8547 timeline keyed by classical security strength (bits).
# 112-bit algorithms (RSA-2048, P-224, DH-2048) are deprecated after 2030, then disallowed.
# 128-bit and stronger (RSA-3072+, P-256+, X25519) are disallowed after 2035.
nist_ir_8547:
  document: "NIST IR 8547 ipd"
  status: draft
  timeline:
    - max_strength: 112
      deprecated_after: 2030
      disallowed_after: 2035
    - max_strength: 256
      disallowed_after: 2035

protocols:
  "SSL 2.0": { status: broken, severity: critical }
  "SSL 3.0": { status: broken, severity: critical }
  "TLS 1.0": { status: broken, severity: high }
  "TLS 1.1": { status: broken, severity: high }

key_exchange:
  # Groups offered one at a time by the OpenSSL 3.5+ probe (OpenSSL spelling).
  pq_probe_groups: [X25519MLKEM768, SecP256r1MLKEM768, SecP384r1MLKEM1024]
  # Harvest-now-decrypt-later: recorded traffic is decryptable once a quantum computer exists,
  # so quantum-vulnerable key exchange outranks quantum-vulnerable certificates.
  quantum_ready: [x25519mlkem768, secp256r1mlkem768, secp384r1mlkem1024, mlkem768, mlkem1024]
  dh_min_bits: 2048
  # Classical security strength of named groups (SP 800-57).
  group_strength:
    secp224r1: 112
    secp256r1: 128
    x25519: 128
    secp384r1: 192
    x448: 224
    secp521r1: 256
    brainpoolp256r1: 128
    brainpoolp384r1: 192
    brainpoolp512r1: 256
  aliases:
    prime256v1: secp256r1

certificate_keys:
  rsa_min_bits: 2048
  quantum_ready: [ml-dsa-44, ml-dsa-65, ml-dsa-87, slh-dsa]

signature_hashes:
  broken: [md5, sha1]

cipher_suites:
  # Quoted: bare NULL would parse as a YAML null.
  broken_if_name_contains: ["RC4", "3DES", "DES_CBC", "NULL", "EXPORT", "anon"]
  weak_if_name_contains: ["CBC"]
  # TLS_RSA_WITH_* suites use static RSA key transport: no forward secrecy.
  static_rsa_prefix: "TLS_RSA_WITH_"

severity:
  broken: high
  weak: medium
  quantum_vulnerable_key_exchange: medium
  classical_fallback_key_exchange: low   # classical group alongside an accepted PQ group
  quantum_vulnerable_certificate: low
  quantum_ready: info

# --- SSH (RFC 4253 algorithm names) --------------------------------------------------------
ssh:
  kex:
    # Harvest-now-decrypt-later applies to SSH exactly as it does to TLS.
    quantum_ready:
      - mlkem768x25519-sha256
      - mlkem768nistp256-sha256
      - mlkem1024nistp384-sha384
      - sntrup761x25519-sha512
      - sntrup761x25519-sha512@openssh.com
    broken:
      - diffie-hellman-group1-sha1
      - diffie-hellman-group14-sha1
      - diffie-hellman-group-exchange-sha1
      - rsa1024-sha1
    # Classical security strength (SP 800-57). Group-exchange is graded at 112 because the
    # server may pick a 2048-bit group.
    strength:
      curve25519-sha256: 128
      curve25519-sha256@libssh.org: 128
      ecdh-sha2-nistp256: 128
      ecdh-sha2-nistp384: 192
      ecdh-sha2-nistp521: 256
      diffie-hellman-group14-sha256: 112
      diffie-hellman-group15-sha512: 128
      diffie-hellman-group16-sha512: 128
      diffie-hellman-group17-sha512: 128
      diffie-hellman-group18-sha512: 192
      diffie-hellman-group-exchange-sha256: 112
    # Extension signals that appear in the kex list but aren't key exchange algorithms.
    pseudo: [ext-info-s, ext-info-c, kex-strict-s-v00@openssh.com, kex-strict-c-v00@openssh.com]

  host_key_algorithms:
    broken:
      ssh-rsa: "RSA signatures with SHA-1"
      ssh-dss: "DSA, 1024-bit and SHA-1"
    rsa_min_bits: 2048

  ciphers:
    broken: [3des-cbc, des-cbc, arcfour, arcfour128, arcfour256, blowfish-cbc, cast128-cbc, none]
    weak_suffix: "-cbc"

  macs:
    broken_if_contains: ["md5", "-96", "none"]
    weak: [hmac-sha1, hmac-sha1-etm@openssh.com, umac-64@openssh.com, umac-64-etm@openssh.com]

  # Terrapin (CVE-2023-48795): prefix truncation against ChaCha20-Poly1305 or CBC+EtM,
  # unless the server supports strict key exchange.
  terrapin:
    strict_marker: kex-strict-s-v00@openssh.com
    vulnerable_ciphers: [chacha20-poly1305@openssh.com]
