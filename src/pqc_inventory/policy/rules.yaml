# Algorithm grading rules. Edit this file, not the code, when guidance changes.
#
# Sources:
#   NIST IR 8547 ipd (Nov 2024), Transition to Post-Quantum Cryptography Standards
#   https://doi.org/10.6028/NIST.IR.8547.ipd  -- still a draft; dates may change.
#   OWASP Top 10:2025 A04 Cryptographic Failures (TLS >= 1.2, forward secrecy, drop CBC)
#
# Statuses:
#   broken             - weak today, independent of quantum computing
#   quantum_vulnerable - acceptable today, on NIST's retirement timeline
#   quantum_ready      - post-quantum or hybrid PQ

schema_version: 1

nist_ir_8547:
  document: "NIST IR 8547 ipd"
  status: draft
  deprecated_after: 2030   # 112-bit security strength (e.g. RSA-2048, P-256)
  disallowed_after: 2035   # all quantum-vulnerable public-key algorithms

protocols:
  "SSL 2.0": broken
  "SSL 3.0": broken
  "TLS 1.0": broken
  "TLS 1.1": broken
  "TLS 1.2": ok
  "TLS 1.3": ok

key_exchange:
  # Harvest-now-decrypt-later exposure makes key exchange the migration priority.
  quantum_ready: [X25519MLKEM768, SecP256r1MLKEM768, SecP384r1MLKEM1024, MLKEM768, MLKEM1024]
  quantum_vulnerable: [X25519, X448, secp256r1, prime256v1, secp384r1, secp521r1, ECDH, DH]
  broken_if:
    dh_min_bits: 2048
    static_rsa_key_exchange: true   # no forward secrecy

certificate_keys:
  broken_if:
    rsa_min_bits: 2048
  quantum_vulnerable: [RSA, EC, Ed25519, Ed448, DSA]
  quantum_ready: [ML-DSA-44, ML-DSA-65, ML-DSA-87, SLH-DSA]

signature_hashes:
  broken: [md5, sha1]

cipher_suites:
  broken_if_name_contains: [RC4, 3DES, DES_CBC, NULL, EXPORT, anon]
  weak_if_name_contains: [CBC]
