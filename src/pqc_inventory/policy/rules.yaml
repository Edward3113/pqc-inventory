# Algorithm grading rules. Edit this file, not the code, when guidance changes.
#
# Sources:
#   NIST IR 8547 ipd (Nov 2024), Transition to Post-Quantum Cryptography Standards
#     https://doi.org/10.6028/NIST.IR.8547.ipd  -- still a draft; dates may change.
#   NIST SP 800-57 Part 1 Rev. 5 -- security strength of RSA / EC / DH key sizes.
#   OWASP Top 10:2025 A04 Cryptographic Failures -- TLS >= 1.2, forward secrecy, drop CBC.
#
# Statuses (worst to best):
#   broken             - weak today, independent of quantum computing
#   weak               - discouraged today (e.g. CBC suites), not immediately exploitable
#   quantum_vulnerable - acceptable today, on NIST's retirement timeline
#   quantum_ready      - post-quantum or hybrid post-quantum
#   ok                 - no finding (symmetric/protocol items with no quantum timeline)

schema_version: 2

# IR 8547 timeline keyed by classical security strength (bits).
# 112-bit algorithms (RSA-2048, P-224, DH-2048) are deprecated after 2030, then disallowed.
# 128-bit and stronger (RSA-3072+, P-256+, X25519) are disallowed after 2035.
nist_ir_8547:
  document: "NIST IR 8547 ipd"
  status: draft
  timeline:
    - max_strength: 112
      deprecated_after: 2030
      disallowed_after: 2035
    - max_strength: 256
      disallowed_after: 2035

protocols:
  "SSL 2.0": { status: broken, severity: critical }
  "SSL 3.0": { status: broken, severity: critical }
  "TLS 1.0": { status: broken, severity: high }
  "TLS 1.1": { status: broken, severity: high }

key_exchange:
  # Harvest-now-decrypt-later: recorded traffic is decryptable once a quantum computer exists,
  # so quantum-vulnerable key exchange outranks quantum-vulnerable certificates.
  quantum_ready: [x25519mlkem768, secp256r1mlkem768, secp384r1mlkem1024, mlkem768, mlkem1024]
  dh_min_bits: 2048
  # Classical security strength of named groups (SP 800-57).
  group_strength:
    secp224r1: 112
    secp256r1: 128
    x25519: 128
    secp384r1: 192
    x448: 224
    secp521r1: 256
    brainpoolp256r1: 128
    brainpoolp384r1: 192
    brainpoolp512r1: 256
  aliases:
    prime256v1: secp256r1

certificate_keys:
  rsa_min_bits: 2048
  quantum_ready: [ml-dsa-44, ml-dsa-65, ml-dsa-87, slh-dsa]

signature_hashes:
  broken: [md5, sha1]

cipher_suites:
  # Quoted: bare NULL would parse as a YAML null.
  broken_if_name_contains: ["RC4", "3DES", "DES_CBC", "NULL", "EXPORT", "anon"]
  weak_if_name_contains: ["CBC"]
  # TLS_RSA_WITH_* suites use static RSA key transport: no forward secrecy.
  static_rsa_prefix: "TLS_RSA_WITH_"

severity:
  broken: high
  weak: medium
  quantum_vulnerable_key_exchange: medium
  quantum_vulnerable_certificate: low
  quantum_ready: info
