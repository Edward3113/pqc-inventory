# Lint + full test suite on Debian 13 (OpenSSL 3.5, so post-quantum tests run),
# CodeQL static analysis, then the demo lab: build it, scan it, and publish the report
# to GitHub Pages on pushes to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container: python:3.12-slim-trixie
    steps:
      - name: Install system tools (OpenSSL 3.5, OpenSSH)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git openssl openssh-client openssh-server
          openssl version

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Start a local sshd for the live SSH test
        run: |
          mkdir -p /run/sshd
          ssh-keygen -A
          /usr/sbin/sshd -p 2222 -o ListenAddress=127.0.0.1

      - name: Test
        run: uv run pytest -v -rs

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  lab:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Start the demo lab
        run: docker compose -f lab/compose.yaml up -d --build --wait

      - name: Scan the lab
        run: |
          mkdir -p lab/output && chmod 777 lab/output
          docker compose -f lab/compose.yaml run --rm scanner
          test -s lab/output/index.html
          test -s lab/output/cbom.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab-report
          path: lab/output

      - name: Package for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: lab/output

      - name: Stop the lab
        if: always()
        run: docker compose -f lab/compose.yaml --profile scan down --remove-orphans

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lab
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
