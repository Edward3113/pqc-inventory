[project]
name = "pqc-inventory"
version = "1.0.0"
description = "Cryptographic inventory scanner that grades TLS and SSH endpoints against NIST's post-quantum transition timeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Edward Sampson-Blue" }]
dependencies = [
    "sslyze>=6.1,<7",
    "cryptography>=42",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
pqc-inventory = "pqc_inventory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "cyclonedx-python-lib[json-validation]>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqc_inventory"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
