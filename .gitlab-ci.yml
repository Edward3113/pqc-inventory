# Milestone 1 pipeline: lint + offline tests + GitLab SAST.
# Later milestones add the docker lab scan and a GitLab Pages report.

stages: [lint, test]

include:
  - template: Jobs/SAST.gitlab-ci.yml

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_CACHE_DIR: .uv-cache

cache:
  key: { files: [uv.lock] }
  paths: [.uv-cache]

lint:
  stage: lint
  script:
    - uv sync --group dev
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  script:
    - uv sync --group dev
    - uv run pytest -v
